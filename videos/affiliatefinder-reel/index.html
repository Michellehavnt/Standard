<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AffiliateFinder reel</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1b26;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1b26;
        font-family: Outfit, Inter, sans-serif;
      }
      [data-composition-id="affiliatefinder-reel"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="affiliatefinder-reel"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: hook card (kinetic-beat-slam) -->
      <div
        id="el-hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.4"
        data-track-index="1"
      ></div>

      <!-- Scene 2: footage cutdown with captions (generated by scripts/build-footage.mjs) -->
      <div
        id="el-footage"
        data-composition-id="footage"
        data-composition-src="compositions/footage.html"
        data-start="2.4"
        data-duration="23.6"
        data-track-index="1"
      ></div>

      <!-- Scene 3: brand close + CTA (logo-assemble-lockup) -->
      <div
        id="el-cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="26"
        data-duration="4"
        data-track-index="1"
      ></div>
    </div>
    <script>
      window.__timelines["affiliatefinder-reel"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
